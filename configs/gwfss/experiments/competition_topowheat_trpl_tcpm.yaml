_BASE_: competition_topowheat_trpl.yaml

MODEL:
  TOPOWHEAT:
    TCPM:
      ENABLED: True
      NUM_DOMAINS: 9
      START_ITER: 0
      MEMORY_WARMUP_ITERS: 5000
      LOSS_RAMP_ITERS: 10000
      PSEUDO_UPDATE_START: 15000
      PSEUDO_RAMP_ITERS: 10000
      LEAVE_ONE_DOMAIN_OUT: True
      MIN_CORE_PIXELS: 4
      # The entropy-derived reliability weight is not a class probability.
      # Combine a moderate reliability floor with an explicit semantic gate.
      PSEUDO_MIN_WEIGHT: 0.50
      PSEUDO_MIN_CONFIDENCE: 0.80
      QUERY_MODE: "hard_region"
      QUERY_MIN_WEIGHT: 0.25
      MAX_QUERY_PIXELS_PER_CLASS: 128
      HARD_QUERY_FRACTION: 0.25
      ALIGNMENT_TOLERANCE: 0.05
      TEMPERATURE: 0.30
      CONTRASTIVE_WEIGHT: 0.05
      DOMAIN_COMPACT_WEIGHT: 0.05
      HARD_NEGATIVE_WEIGHT: 0.02
      HARD_NEGATIVE_MARGIN: 0.20
    BAZR:
      ENABLED: False
      AUX_HEADS_ENABLED: False
