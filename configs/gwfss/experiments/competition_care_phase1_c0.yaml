_BASE_: competition_baseline.yaml

MODEL:
  WEIGHTS: "outputs/competition_baseline/model_best.pth"
  CARE:
    ENABLED: False

SSL:
  TRAIN_SSL: False
  EVAL_WHO: "TEACHER"

