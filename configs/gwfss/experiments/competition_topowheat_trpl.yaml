_BASE_: competition_stage2_stem4500.yaml

SSL:
  # Initialize both branches from the selected Stage I checkpoint and keep
  # the EMA trajectory continuous throughout Stage II.
  WARM_START: True
  BURNIN_ITER: 0
  EMA_UPDATE_START: 0
  RESET_TEACHER_AT_START: False
  EMA_DECAY: 0.9999
  DIAGNOSTIC_PERIOD: 2500

SOLVER:
  # Keep the v2 optimization budget so the refactor remains a controlled
  # mechanism comparison; validation still selects the best checkpoint.
  BASE_LR: 0.00005
  MAX_ITER: 30000
  CHECKPOINT_PERIOD: 2500

TEST:
  EVAL_PERIOD: 2500

MODEL:
  SEM_SEG_HEAD:
    # TopoWheat excludes the SAPA upsampler used by the competition method.
    UPSAMPLE_MODE: "bilinear"
  TOPOWHEAT:
    TRPL:
      ENABLED: True
      VIEW_SCALE: 0.875
      RELIABILITY_THRESHOLD: 0.75
      TOPOLOGY_WEIGHT: 0.5
      RAMP_ITERS: 5000
    TCPM:
      ENABLED: False
    BAZR:
      ENABLED: False
      AUX_HEADS_ENABLED: False
